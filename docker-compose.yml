  #  command: redis-server #/data/redis.conf #--appendonly yes
  #  #ports:
  #  #  - "6379:6379"
  #  volumes:
  #    - "$PWD/redis:/data"
  #  networks:
  #    - gmodnet

networks:
  gmodnet:
