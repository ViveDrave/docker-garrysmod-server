version: "2"

services:
  gmod:
    build:
      context: .
    command: -port $PORT \
      -tickrate 32 \
      -maxplayers 16 \
      -insecure \
      +gamemode darkrp \
      +map gm_construct
    stdin_open: true
    tty: true
    ports:
      - "$PORT:$PORT/udp"
    volumes:
      - $PWD/addons:/gmodserv/garrysmod/addons/
      - $PWD/data:/gmodserv/garrysmod/data/
      - $PWD/darkrp:/gmodserv/garrysmod/gamemodes/darkrp/
      - $PWD/gmas:/gmodserv/garrysmod/cache/srcds/
      - $PWD/luabin:/gmodserv/garrysmod/lua/bin/
      - $PWD/sv.db:/gmodserv/garrysmod/sv.db
    # How to fix that docker shit?
    # https://img.qweqwe.ovh/1532284325896.png
    hostname: keklol
    extra_hosts:
      - keklol:$HOSTIP
    networks:
      - gmodnet

  #redis:
